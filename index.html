<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi Santé</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <h1>Application de Suivi Santé</h1>
  <div class="controls">
    <input type="text" id="recherche" placeholder="Recherche type...">
    <input type="date" id="dateRecherche">
    <select id="filtre">
      <option value="Tous">Tous</option>
      <option value="Sport">Sport</option>
      <option value="Eau">Eau</option>
      <option value="Sommeil">Sommeil</option>
    </select>
  </div>
  <div class="stats">
    <div class="stat">
      <h3>Total Activités</h3>
      <span id="totalActivites">0</span>
    </div>
    <div class="stat">
      <h3>Total Sport</h3>
      <span id="totalSport">0</span>
    </div>
    <div class="stat">
      <h3>Total Eau</h3>
      <span id="totalEau">0</span>
    </div>
  </div>
  <div id="activites"></div>
  <script src="script.js"></script>
</body>
</html>
